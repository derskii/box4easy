name: Box4Easy RC Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Box4Easy RC
        uses: actions/checkout@v4
        with:
          ref: agent/material-you-v1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/box4easy/go.mod

      - name: Materialize and test helper
        working-directory: tools/box4easy
        run: |
          sh materialize.sh
          go test ./...
          go vet ./...

      - name: Build helper binaries
        working-directory: tools/box4easy
        run: |
          mkdir -p ../../easy-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../../easy-bin/box4easy-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags='-s -w' -o ../../easy-bin/box4easy-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../../easy-bin/box4easy-x86_64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -trimpath -ldflags='-s -w' -o ../../easy-bin/box4easy-x86 .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build Material You WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Build flashable module ZIP
        run: sh build.sh

      - name: Verify module ZIP
        run: |
          set -e
          file=$(ls box4easy_*.zip | head -n1)
          unzip -t "$file"
          unzip -l "$file" | grep -q 'module.prop'
          unzip -l "$file" | grep -q 'customize.sh'
          unzip -l "$file" | grep -q 'webroot/index.html'
          unzip -l "$file" | grep -q 'easy-bin/box4easy-arm64'
          echo "Verified: $file"

      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: box4easy-rc-module
          path: box4easy_*.zip
          if-no-files-found: error
