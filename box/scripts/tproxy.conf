#!/bin/sh

# Configuration (modify as needed)
# Proxy core configuration
# Proxy running user and group
CORE_USER_GROUP="root:net_admin"
# Proxy traffic mark
ROUTING_MARK=""
FORCE_MARK_BYPASS=0
# Proxy ports (transparent proxy listening ports)
PROXY_TCP_PORT="1536"
PROXY_UDP_PORT="1536"

# Proxy mode: 0=auto (check TPROXY support), 1=force TPROXY, 2=force REDIRECT
PROXY_MODE=0

# Performance mode (0=normal, 1=performance optimized)
PERFORMANCE_MODE=0

# DNS configuration
# DNS hijack method (0: disabled, 1: tproxy, 2: redirect)
DNS_HIJACK_ENABLE=1
# DNS listening port
DNS_PORT="1053"

# Interface definitions
MOBILE_INTERFACE="rmnet_data+"
WIFI_INTERFACE="wlan0"
HOTSPOT_INTERFACE="wlan2"
USB_INTERFACE="rndis+"
OTHER_BYPASS_INTERFACES=""
OTHER_PROXY_INTERFACES=""

# Proxy switches
PROXY_MOBILE=1
PROXY_WIFI=1
PROXY_HOTSPOT=0
PROXY_USB=0
PROXY_TCP=1
PROXY_UDP=1

# IPv6 proxy control:
#  0 = don't proxy IPv6, but keep the Android IPv6 stack alive (safe default)
#  1 = proxy IPv6
# -1 = force-disable the IPv6 stack entirely
PROXY_IPV6=0

BYPASS_IPv4_LIST="0.0.0.0/8 10.0.0.0/8 100.0.0.0/8 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 255.255.255.255/32"
BYPASS_IPv6_LIST="::/128 ::1/128 ::ffff:0:0/96 100::/64 64:ff9b::/96 2001::/32 2001:10::/28 2001:20::/28 2001:db8::/32 2002::/16 fe80::/10 ff00::/8 2409:8000::/20 2408:8000::/20 240e::/18"
PROXY_IPv4_LIST=""
PROXY_IPv6_LIST=""

HOTSPOT_SUBNET_IPV4="192.168.43.0/24"
HOTSPOT_SUBNET_IPV6="fe80::/10"

MARK_VALUE=20
MARK_VALUE6=25
TABLE_ID=2025

# Per-app proxy
APP_PROXY_ENABLE=0
PROXY_APPS_LIST=""
BYPASS_APPS_LIST=""
APP_PROXY_MODE="blacklist"

# CN IP bypass
BYPASS_CN_IP=0
CN_IP_FILE="cn.zone"
CN_IPV6_FILE="cn_ipv6.zone"
CN_IP_URL="https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt"
CN_IPV6_URL="https://ispip.clang.cn/all_cn_ipv6.txt"

# Hotspot MAC filters
MAC_FILTER_ENABLE=0
PROXY_MACS_LIST=""
BYPASS_MACS_LIST=""
MAC_PROXY_MODE="blacklist"

# Block direct QUIC
BLOCK_QUIC=0

# Dry-run mode
DRY_RUN=0
